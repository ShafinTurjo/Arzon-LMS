services:
  web:
    build: .
    env_file: .env
    command: sh -c 'python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --access-logfile -'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - arzon-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    build: .
    env_file: .env
    command: python manage.py worker
    volumes:
      - arzon-data:/app/data
      - arzon-backups:/app/backups
    environment:
      BACKUP_DIR: /app/backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  arzon-data:
  arzon-backups:
